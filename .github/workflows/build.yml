name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        board: [40, 41]
    env:
      ARM_TOOLCHAIN_VERSION: 15.3.rel2
      ARM_TOOLCHAIN_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a
    steps:
      - uses: actions/checkout@v7

      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64

      - name: Download the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          archive="arm-gnu-toolchain-$ARM_TOOLCHAIN_VERSION-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL --retry 3 -o "$archive" "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/$ARM_TOOLCHAIN_VERSION/$archive"
          echo "$ARM_TOOLCHAIN_SHA256  $archive" | sha256sum -c
          mkdir -p ~/arm-gnu-toolchain
          tar -xf "$archive" -C ~/arm-gnu-toolchain --strip-components=1
          rm "$archive"

      - name: Install the toolchain
        run: echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"

      - name: Build the tests
        run: |
          arm-none-eabi-gcc --version | head -1
          cmake -S tests -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEENSY_BOARD=${{ matrix.board }}
          cmake --build build
          for name in basic cpp20 midi stdlib; do
            test -f "build/teensy_test_$name.hex"
          done

      - name: Check the unwind tables
        run: |
          result=0
          for elf in build/*.elf; do
            if arm-none-eabi-readelf -u "$elf" 2>&1 | grep -E "^(arm-none-eabi-)?readelf: (Warning|Error)"; then
              echo "::error::Corrupt unwind tables in $elf"
              result=1
            fi
          done
          exit $result
